<script>
//CORE
const inflate=async u=>{const d=new DecompressionStream('deflate-raw'),w=d.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(d.readable).arrayBuffer())};
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();let e=u.length-22;while(dv.getUint32(e,true)!==0x06054b50)e--;

for(let i=0;i<n;i++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),nm=td.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),d=u.subarray(st,st+cs);F[nm]=async()=>td.decode(m?await inflate(d):d)}return F}
const un=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,c)=>String.fromCharCode(c)).replace(/&amp;/g,'&');
const at=(s,k)=>(s.match(new RegExp('\\b'+k+'="([^"]*)"'))||[])[1];
const col=r=>{let n=0;for(const ch of r.replace(/\d/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readXlsx(buf){const F=await unzip(buf),g=async k=>F[k]?await F[k]():'';
const ss=[...(await g('xl/sharedStrings.xml')).matchAll(/<si\b[\s\S]*?<\/si>/g)].map(m=>un([...m[0].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));
const rels={};for(const m of (await g('xl/_rels/workbook.xml.rels')).matchAll(/<Relationship\b[^>]*>/g))rels[at(m[0],'Id')]=at(m[0],'Target').replace(/^\/?(xl\/)?/,'xl/');
const out={};for(const m of (await g('xl/workbook.xml')).matchAll(/<sheet\b[^>]*>/g)){const nm=un(at(m[0],'name')),rid=at(m[0],'r:id'),x=await g(rels[rid]),rows=[];
for(const rm of x.matchAll(/<row\b([^>]*)>([\s\S]*?)<\/row>/g)){const ri=+at(rm[1],'r')-1,row=[];
for(const cm of rm[2].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){if(!cm[2])continue;const t=at(cm[1],'t'),ci=col(at(cm[1],'r')),v=(cm[2].match(/<v>([\s\S]*?)<\/v>/)||[])[1];let val;
if(t=='s')val=ss[+v];else if(t=='inlineStr')val=un([...cm[2].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(z=>z[1]).join(''));else if(v==null)continue;else if(t=='str'||t=='e')val=un(v);else val=+v;row[ci]=val}
rows[ri]=row}out[nm]=Array.from(rows,r=>r||[])}return out}
const iso=v=>typeof v=='number'&&v>30000&&v<80000?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10):(v?String(v).slice(0,10):'');
const num=v=>typeof v=='number'?v:(parseFloat(String(v??'').replace(/[$,]/g,''))||0);
function build(wb){const T=n=>{const r=wb[n]||[],h=r[0]||[];return r.slice(1).map(x=>{const o={};h.forEach((k,i)=>{if(k!=null&&k!=='')o[String(k).trim()]=x[i]});return o}).filter(o=>Object.keys(o).length)};
const defs={};T('List of Defects').forEach(d=>{if(d['Error Category'])defs[String(d['Error Category']).trim()]=d});
const dsh=wb.Dashboard||[],tgt=num((dsh[2]||[])[14])||.95,amb=num((dsh[3]||[])[14])||.05;
const prod={};T('Production').forEach(p=>{if(p['Emp ID'])prod[p['Emp ID']]=(prod[p['Emp ID']]||0)+1});
const R=T('Audit Data').filter(a=>a['Emp ID']&&a['Audit Status']).map(a=>{const raw=String(a['Error Categories']||'').trim(),cats=!raw?[]:defs[raw]?[raw]:raw.split(/\s*[;\n|]\s*/).filter(Boolean);
const st=String(a['Audit Status']),err=!/^no error$/i.test(st)||cats.length>0||num(a['# of Error'])>0,n=err?(num(a['# of Error'])||cats.length||1):0;
const w=err?Math.max(...(cats.map(c=>defs[c]?num(defs[c].Weightage):1).concat(cats.length?[]:[1]))):0,billed=num(a['Total Billed Charges']);
const ad=iso(a['Audit Date']),doj=iso(a['DOJ']),ten=num(a['Duration (months)'])||(doj&&ad?Math.max(0,(new Date(ad)-new Date(doj))/2629800000):0);
return{emp:a['Emp ID'],name:a['Associate Name'],sup:a['Supervisor Name'],mgr:a['Manager'],date:ad,week:a['Week']||'',act:a['Activity Type']||'',st,cats,err,n,w,billed,rev:err?(num(a['Revenue Impact'])||billed):0,ins:a['Insurance']||'(blank)',reb:String(a['Rebuttal']||'').trim(),dpo:num(a['DPO'])||1,acct:a['Account#'],fac:a['Facility'],ten,prod:prod[a['Emp ID']]}});
const rd=iso((dsh[2]||[])[3])||R.map(r=>r.date).sort().pop()||'';
return{R,defs,tgt,amb,rd,sheets:Object.keys(wb)}}
//ENDCORE
let M0=null,cur='home',ROLE='Manager',PAL=['#e95420','#c7162b','#f99b11','#3eb34f','#19b6ee'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
fmt=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(1)+'k':(+(+v).toFixed(2))+'',pct=v=>v==null?'–':(v*100).toFixed(1)+'%',
grp=(A,f)=>{const m=new Map();A.forEach(a=>{const k=f(a)??'(blank)';(m.get(k)||m.set(k,[]).get(k)).push(a)});return m},
sum=(A,f)=>A.reduce((s,a)=>s+f(a),0),mean=a=>a.length?sum(a,x=>x)/a.length:0,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))},
none='<p class="mut">No data for current filters.</p>',$=s=>document.querySelector(s);
const W=640,H=270,ML=46,MR=34,MT=14,MB=58,sc=(a,b,c,d)=>v=>c+(v-a)/((b-a)||1)*(d-c);
function plotSVG(o){const L=o.labels,S=o.series,all=S.flatMap(s=>s.v).filter(v=>v!=null);if(!all.length)return none;
const y0=o.y0??Math.min(0,...all),y1=o.y1??Math.max(...all,1)*1.1,n=L.length,bw=(W-ML-MR)/n,X=i=>ML+bw*(i+.5),Y=sc(y0,y1,H-MB,MT);let s=`<svg viewBox="0 0 ${W} ${H}">`;
for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);s+=`<line class="g" x1="${ML}" x2="${W-MR}" y1="${y}" y2="${y}"/><text class="t" x="${ML-5}" y="${y+3}" text-anchor="end">${(o.fy||fmt)(v)}</text>`;if(o.ry)s+=`<text class="t" x="${W-MR+4}" y="${y+3}">${i*25}%</text>`}
L.forEach((l,i)=>{if(i%Math.ceil(n/24)==0)s+=`<text class="t" transform="translate(${X(i)},${H-MB+12}) rotate(30)">${esc(String(l).slice(0,16))}</text>`});
S.forEach((q,k)=>{const c=q.c||PAL[k%5];if(q.bar)q.v.forEach((v,i)=>s+=`<rect x="${X(i)-bw*.35}" y="${Y(Math.max(v,0))}" width="${bw*.7}" height="${Math.abs(Y(0)-Y(v))}" fill="${c}"><title>${esc(L[i])}: ${fmt(v)}</title></rect>`);
else{let d='';q.v.forEach((v,i)=>{if(v!=null)d+=(d?'L':'M')+X(i)+' '+Y(v)});s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" ${q.d?'stroke-dasharray="5 4"':''}/>`;if(!q.nop)q.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${c}"><title>${esc(L[i])}: ${fmt(v)}</title></circle>`})}});
let lx=ML;S.forEach((q,k)=>{if(q.n){s+=`<text class="t" style="fill:${q.c||PAL[k%5]}" x="${lx}" y="${H-4}">● ${esc(q.n)}</text>`;lx+=q.n.length*6+24}});return s+'</svg>'}
function scatSVG(P,xl,yl){if(P.length<2)return none;const xs=P.map(p=>p.x),ys=P.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x0==x1)x1=x0+1;if(y0==y1)y1=y0+1;
const X=sc(x0,x1,ML+8,W-MR-8),Y=sc(y0,y1,H-MB+16,MT+6);let s=`<svg viewBox="0 0 ${W} ${H}">`;
for(let i=0;i<=4;i++){const y=Y(y0+(y1-y0)*i/4);s+=`<line class="g" x1="${ML}" x2="${W-MR}" y1="${y}" y2="${y}"/><text class="t" x="${ML-5}" y="${y+3}" text-anchor="end">${fmt(y0+(y1-y0)*i/4)}</text><text class="t" x="${X(x0+(x1-x0)*i/4)}" y="${H-MB+32}" text-anchor="middle">${fmt(x0+(x1-x0)*i/4)}</text>`}
const mx=mean(xs),my=mean(ys),sxx=sum(xs,x=>(x-mx)**2),sxy=sum(P,p=>(p.x-mx)*(p.y-my)),syy=sum(ys,y=>(y-my)**2),b=sxx?sxy/sxx:0,r=sxx&&syy?sxy/Math.sqrt(sxx*syy):0;
P.forEach(p=>s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${PAL[0]}" opacity=".75"><title>${esc(p.t)}: ${fmt(p.x)}, ${fmt(p.y)}</title></circle>`);
s+=`<line x1="${X(x0)}" y1="${Y(my+b*(x0-mx))}" x2="${X(x1)}" y2="${Y(my+b*(x1-mx))}" stroke="${PAL[1]}" stroke-dasharray="5 4" stroke-width="2"/><text class="t" x="${ML}" y="${H-4}">X: ${esc(xl)} · Y: ${esc(yl)} · r = ${r.toFixed(2)} (${Math.abs(r)>.5?'notable':'weak'} correlation, n=${P.length})</text></svg>`;return s}
/* ---- Chart.js layer: views queue chart specs (CQ); mount() instantiates them after the HTML is in the DOM ---- */
